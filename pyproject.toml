[project]
name = "hazrakah"
version = "0.0.0"
description = "..a tiny but powerful DI library for Python."
keywords = ["DI", "dependency injection"]
authors = [
    { name="Shaun Wilson", email="mrshaunwilson@msn.com" }
]
readme = "README.md"
license = "MIT"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python"
]
requires-python = ">=3.11"
dependencies = [
]

[dependency-groups]
dev = [
    "hanaro (>=1.3.2)",
    "coverage",
    "mypy",
    "punit (>=1.13.9)",
    "py-conventional-semver (>=1.3.4)",
    "twine"
]

[project.urls]
Documentation = "https://hazrakah.readthedocs.io/"
Homepage = "https://github.com/wilson0x4d/hazrakah"
Repository = "https://github.com/wilson0x4d/hazrakah.git"

[tool.setuptools.package-data]
"hazrakah" = ["py.typed", "SKILL.md"]

[tool.uv]
package = true
