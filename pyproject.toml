[project]
name = "hazrakah"
version = "0.0.0"
description = "..a tiny but powerful DI library for Python."
keywords = ["DI", "dependency injection"]
authors = [
    { name="Shaun Wilson", email="mrshaunwilson@msn.com" }
]
readme = "README.md"
license = "MIT"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15"
]
requires-python = ">=3.11"
dependencies = [
]

[dependency-groups]
dev = [
    "coverage",
    "hanaro (>=2.0.1)",
    "mypy",
    "punit (>=1.14.1)",
    "py-conventional-semver (>=2.0.0)"
]

[project.urls]
Documentation = "https://hazrakah.readthedocs.io/"
Homepage = "https://github.com/wilson0x4d/hazrakah"
Repository = "https://github.com/wilson0x4d/hazrakah.git"

[tool.setuptools.package-data]
"hazrakah" = ["py.typed", "SKILL.md"]

[tool.uv]
package = true
